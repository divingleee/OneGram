name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Release
    # Project's MACOSX_DEPLOYMENT_TARGET is 27.0, so it needs Xcode 27 (macOS 27 SDK).
    # `macos-latest` currently ships Xcode 26 and fails to build it.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"            # e.g. v0.0.1-Beta
          else
            TAG="v0.0.${GITHUB_RUN_NUMBER}"
          fi
          VERSION="${TAG#v}"                    # 0.0.1-Beta
          MARKETING="${VERSION%%-*}"            # 0.0.1
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "marketing=${MARKETING}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${TAG} version=${VERSION} marketing=${MARKETING} prerelease=${PRERELEASE}"

      - name: Build (archive)
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          xcodebuild archive \
            -project OneGram.xcodeproj \
            -scheme OneGram \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/OneGram.xcarchive" \
            MARKETING_VERSION="${MARKETING}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package app into DMG
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APP="$RUNNER_TEMP/OneGram.xcarchive/Products/Applications/OneGram.app"
          test -d "$APP"

          # Ad-hoc sign so the app runs on Apple Silicon without a Developer ID.
          codesign --force --sign - --timestamp=none "$APP" || true
          codesign --verify --verbose=2 "$APP" || true

          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG="OneGram-${TAG}.dmg"
          hdiutil create -volname "OneGram" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          echo "dmg=${DMG}" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneGram ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.dmg }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
